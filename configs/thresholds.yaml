confidence:
  accept: 0.92
  review: 0.85
  fallback_trigger: 0.80

fallback:
  enabled: true
  max_attempts: 3

ocr:
  primary_engine: paddleocr
  fallback_engine: tesseract
  paddleocr_lang: japan
  tesseract_lang: jpn+eng
  tesseract_config: "--oem 1 --psm 7"

render:
  dpi: 300
  colorspace: rgb

preprocessing:
  deskew_threshold_deg: 1.0
  denoise_strength: 3
  contrast_clip_limit: 2.0
  contrast_tile_grid: 8
