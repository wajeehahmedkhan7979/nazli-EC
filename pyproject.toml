[project]
name = "ec-pdf-extractor"
version = "1.0.0"
description = "ERP Export Certificate PDF field extraction service"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
