[project]
name = "ec-extractor"
version = "2.0.0"
description = "EC PDF field extractor — no AI, no paid services"
requires-python = ">=3.10"
dependencies = [
    # PDF rendering
    "pymupdf>=1.24.0",
    # Image processing
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    # OCR (Tesseract wrapper — Tesseract binary must be installed separately)
    "pytesseract>=0.3.10",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # HTTP client for forwarding results to frontend/ERP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
