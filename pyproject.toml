[project]
name = "ec-extractor"
version = "2.0.0"
description = "EC PDF field extractor — PaddleOCR-based"
requires-python = ">=3.10,<3.13"
dependencies = [
    # PDF rendering
    "pymupdf>=1.24.0",
    # Image processing
    "pillow>=10.0.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.9.0",
    # OCR (Paddle stack — explicitly pinned)
    "paddlepaddle==3.2.2",
    "paddleocr==2.7.3",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # HTTP client
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
